name: Publish release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version and run tests
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")
          version = json.loads(Path("custom_components/tataille_french_holidays/manifest.json").read_text())["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match manifest version {version}")
          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          PY
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components

      - name: Package release
        run: |
          python - <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          archive = Path(f"homeassistant-french-holidays-{tag}.zip")
          files = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True
          ).splitlines()
          included = [
              path for path in files
              if path.startswith(("custom_components/", "docs/"))
              or path in {"README.md", "LICENSE", "hacs.json"}
          ]
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for path in included:
                  output.write(path, arcname=f"homeassistant-french-holidays/{path}")
          PY
          sha256sum "homeassistant-french-holidays-$TAG_NAME.zip" > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            "homeassistant-french-holidays-$TAG_NAME.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "French Holidays $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md" \
            --latest
