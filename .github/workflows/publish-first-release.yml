name: Publish validated release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-first-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.1.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - name: Require successful validation of release source
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/38170844625 > validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path("validation.json").read_text())
          assert run["head_sha"] == "1a7de6c3a6a7a6181befb0b085fea57ed282fd97"
          assert run["conclusion"] == "success"
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 1a7de6c3a6a7a6181befb0b085fea57ed282fd97
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version and run tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/french_holidays/manifest.json").read_text())
          assert manifest["version"] == "0.1.2"
          PY
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components
      - name: Package verified release source
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              archive = root / "source.zip"
              subprocess.run(["git", "archive", "--format=zip", "--output", str(archive), "1a7de6c3a6a7a6181befb0b085fea57ed282fd97"], check=True)
              with zipfile.ZipFile(archive) as source, zipfile.ZipFile("homeassistant-french-holidays-v0.1.2.zip", "w", zipfile.ZIP_DEFLATED) as output:
                  for name in source.namelist():
                      if name.startswith(("custom_components/", "docs/")) or name in {"README.md", "LICENSE", "hacs.json"}:
                          if not name.endswith("/"):
                              output.writestr(name, source.read(name))
          PY
          sha256sum homeassistant-french-holidays-v0.1.2.zip > SHA256SUMS.txt
      - name: Publish GitHub release with install archive
        run: |
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.2 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.1.2 \
            homeassistant-french-holidays-v0.1.2.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "French Holidays v0.1.2 — Préparation au catalogue HACS" \
            --notes-file docs/releases/v0.1.2.md \
            --latest
